# ==============================================================================
# Pure Hugging Face Fine-Tuning Configuration for NVIDIA H100 SXM (80GB VRAM)
# Target Model: Google Gemma 4 E4B (Pure BF16, 128k context, native system role)
# ==============================================================================

model:
  name_or_path: "google/gemma-4-E4B-it"
  load_in_4bit: false # Pure 16-bit BF16 (No quantization noise; maximum Hopper Tensor Core throughput)
  attn_implementation: "sdpa" # Gemma uses large head dimensions unsupported by FlashAttention kernels; SDPA uses native PyTorch Hopper kernels

lora:
  r: 32 # Higher rank captures nuanced legal reasoning and statutory exceptions
  lora_alpha: 64 # Standard scaling ratio (alpha / r = 2.0)
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"
  lora_dropout: 0.0 # Standard 0.0 dropout for modern instruction LoRA
  bias: "none"

training:
  output_dir: "./output/gemma-4-e4b-civil-code-lora"
  num_train_epochs: 3
  per_device_train_batch_size: 2 # Fast 2-sample micro-batches (drops step latency from 7.8s to ~0.7s)
  gradient_accumulation_steps: 8 # Effective batch size = 16 (2 * 8 = 16)
  learning_rate: 1.0e-4 # Optimal learning rate for 16-bit LoRA on Gemma
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.05
  max_seq_length: 2048 # Accommodates 100% of dataset samples (0% truncation)
  bf16: true
  fp16: false
  optim: "adamw_torch_fused" # Fast fused AdamW for NVIDIA Ada Lovelace / Hopper Cores
  logging_steps: 10
  save_strategy: "epoch"
  eval_strategy: "epoch"
  load_best_model_at_end: true
  metric_for_best_model: "eval_loss"
  save_total_limit: 2 # Retain only the best and latest checkpoint to prevent filling RunPod disk
  seed: 3407
  dataloader_num_workers: 4 # Prefetches data asynchronously on 4 CPU workers

dataset:
  train_file: "train_clean_ragas.jsonl"
  eval_file: "eval_ragas_clean.jsonl"